name: Build and Deploy

on:
  push:
    branches:
      - master

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercased image name
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_TAG_LATEST=${IMAGE_LOWER}:latest" >> $GITHUB_ENV
          echo "IMAGE_TAG_SHA=${IMAGE_LOWER}:${{ github.sha }}" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_TAG_LATEST }}
            ${{ env.IMAGE_TAG_SHA }}
          build-args: |
            NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN=${{ vars.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Without this the script runs on past any failure and the step takes
          # its status from the last command, so a deploy that changed nothing
          # still reports green.
          script_stop: true
          script: |
            set -eu
            cd ~/projects/OGE_ENG_WEB

            # The server runs whatever files already sit in this directory, and
            # nothing ever synced them: the compose file here was still the
            # pre-CI/CD one that builds images locally instead of pulling from
            # GHCR, which is why `pull` skipped both services and the old
            # container kept running. Sync the checkout first so the compose
            # file and the mounted nginx config can never drift from the repo.
            # `.env` is gitignored and nginx/certbot/ is untracked, so a hard
            # reset leaves both alone. Never add `git clean` here — it would
            # delete the live TLS certificates and the env file.
            git fetch origin master
            git reset --hard ${{ github.sha }}

            IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            # Pin the commit SHA rather than passing a bare, untagged name:
            # compose needs an explicit tag to resolve the service image, and a
            # reference that changes every deploy is what makes `up -d`
            # actually recreate the container instead of leaving it running.
            export IMAGE_NAME="${IMAGE_LOWER}:${{ github.sha }}"
            echo "Deploying $IMAGE_NAME"

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose -f docker-compose.prod.yml config --images || true
            docker compose -f docker-compose.prod.yml pull
            if ! docker compose -f docker-compose.prod.yml up -d --remove-orphans; then
              docker compose -f docker-compose.prod.yml logs --no-color --tail=200 migrator
              exit 1
            fi

            # nginx.conf is bind-mounted as a single file. `git reset --hard`
            # can replace that file with a new inode while the running
            # container keeps the old mount. Validate the new host file in a
            # temporary container, then recreate nginx so it mounts that file.
            docker compose -f docker-compose.prod.yml run --rm --no-deps nginx nginx -t
            docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate nginx
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -t

            # The failure mode this job had was silent: pull skipped the image,
            # the old container kept running, and the step still passed. Assert
            # the outcome so that can only ever come back as a red build.
            RUNNING=$(docker inspect --format '{{.Config.Image}}' \
              "$(docker compose -f docker-compose.prod.yml ps -q web)")
            if [ "$RUNNING" != "$IMAGE_NAME" ]; then
              echo "Deploy verification failed: web is running '$RUNNING', expected '$IMAGE_NAME'"
              exit 1
            fi
            echo "Verified: web is running $RUNNING"

            docker image prune -f

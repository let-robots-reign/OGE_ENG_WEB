name: oge-eng-web

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  migrator:
    image: ${IMAGE_NAME:-ghcr.io/let-robots-reign/oge_eng_web:latest}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    command: ["migrate.mjs"]
    logging: *default-logging

  web:
    image: ${IMAGE_NAME:-ghcr.io/let-robots-reign/oge_eng_web:latest}
    restart: always
    depends_on:
      migrator:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - AUTH_URL=https://oge-eng.ru
    volumes:
      - audio_uploads:/app/public/uploads/audio
    logging: *default-logging

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  nginx:
    image: nginx:1.23-alpine
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
      - audio_uploads:/var/www/uploads/audio:ro
    depends_on:
      - web
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
    logging: *default-logging

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    depends_on:
      - nginx
    # Always use the webroot shared with nginx. This overrides stale renewal
    # metadata if the certificate was previously issued in standalone mode.
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"
    logging: *default-logging

volumes:
  postgres_data:
  audio_uploads:
